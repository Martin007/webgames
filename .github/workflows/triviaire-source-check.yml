name: Triviaire source check
on:
  push:
    branches: [feat/triviaire-game-hub]
    paths: [.github/workflows/triviaire-source-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install existing project dependencies for verification
        run: npm ci
      - name: Archive dependencies for local verification
        run: |
          mkdir -p /tmp/triviaire-verification
          tar -czf /tmp/triviaire-verification/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: triviaire-dependencies
          path: /tmp/triviaire-verification/node_modules.tar.gz
          retention-days: 1
